[package]
name = "kosuzu"
version = "0.1.0"
edition = "2021"
description = "translate tool"

[dependencies]
kosuzu-ocr = { path = "../kosuzu-ocr" }
gtk4 = { version = "0.11", features = ["v4_22"] }
anyhow = "1"
libadwaita = { version = "0.9", features = ["v1_5", "gtk_v4_22"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "charset", "http2", "blocking"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
